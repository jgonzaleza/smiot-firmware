; Smart IoT end node. Cellular is the default image. Wi-Fi is a separate env.

[platformio]
default_envs = endnode_cell
src_dir = endnode
boards_dir = boards

[env]
platform = espressif32@6.7.0
framework = arduino
board = lilygo-t-a7608x-s3
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.f_cpu = 80000000L
extra_scripts = pre:scripts/check_client_certs.py

[env:endnode_cell]
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=0
	-DLILYGO_T_A7608X_S3
	-DTINY_GSM_MODEM_A7608
	-DFIRMWARE_VERSION=407
	-DDEFAULT_DEVICE_TYPE=2
	-DPACK_V_VALUE_NAME=\"b_v_v\"
	-DPACK_V_SCALE=0.01f
	-DSIM_PREFIXES=\"89464:hologram,89883:emnify\"
	-DNET_STICKY_HOURS=24
	-DGPS_COLD_BUDGET_SEC=90
	-DGPS_WARM_BUDGET_SEC=30
	-DGPS_FAIL_BUDGET_SEC=15
	-DGPS_POLL_MS=2000
	-DCHECK_FIRMWARE_UPDATE_URL=\"https://95exjczj8b.execute-api.us-east-1.amazonaws.com/pro/device_firmware_config\"
board_upload.offset_address = 0x20000
build_src_filter =
	+<*>
	-<WifiCommunicationClient.cpp>
lib_ignore =
	WiFi
	WiFiClientSecure
	HTTPClient
lib_deps =
	bblanchon/ArduinoJson@7.4.2
	vshymanskyy/StreamDebugger@1.0.1
	4-20ma/ModbusMaster@2.0.1

[env:endnode_wifi]
extends = env:endnode_cell
build_flags =
	${env:endnode_cell.build_flags}
	-DFEATURE_WIFI
	-DMQTT_MAX_PACKET_SIZE=12288
build_src_filter =
	+<*>
lib_ignore =
lib_deps =
	bblanchon/ArduinoJson@7.4.2
	vshymanskyy/StreamDebugger@1.0.1
	4-20ma/ModbusMaster@2.0.1
	knolleary/PubSubClient@2.8.0
